<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport renewal guide - screen 1 (prototype, made-up data)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
  header { background: #444; color: #fff; padding: 12px 20px; }
  header strong { display: block; font-size: 18px; }
  header span { font-size: 13px; }
  main { max-width: 560px; margin: 24px auto; background: #fff; border: 1px solid #ccc; padding: 24px; }
  .progress { font-size: 14px; color: #555; margin-bottom: 8px; }
  .bar { height: 8px; background: #ddd; margin-bottom: 20px; }
  .bar div { height: 8px; background: #555; width: 20%; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  .choice { display: block; border: 2px solid #aaa; padding: 16px; margin: 12px 0; font-size: 18px; cursor: pointer; }
  .choice:has(input:checked) { border-color: #222; background: #eee; }
  .choice input { margin-right: 10px; transform: scale(1.3); }
  .hint { font-size: 14px; color: #555; margin: 4px 0 0 30px; }
  button { font-size: 16px; padding: 10px 20px; margin-top: 16px; background: #333; color: #fff; border: 1px solid #333; cursor: pointer; }
  button:disabled { background: #bbb; border-color: #bbb; cursor: not-allowed; }
  #next-msg { margin-top: 12px; font-size: 14px; color: #555; }
  .made-up { font-size: 12px; color: #777; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <strong>Passport renewal guide</strong>
  <span>PROTOTYPE. Not the real ICA site. Everything here is made up.</span>
</header>

<main>
  <div class="progress">Step 1 of 5</div>
  <div class="bar"><div></div></div>

  <h1>Who is this passport for?</h1>

  <label class="choice">
    <input type="radio" name="who" value="self"> Myself
  </label>
  <label class="choice">
    <input type="radio" name="who" value="child"> My child
    <div class="hint">You are the parent. You get extra help.</div>
  </label>

  <button id="next" disabled>Next</button>
  <div id="next-msg" aria-live="polite"></div>

  <p class="made-up">Prototype screen 1 of 5. Made-up data only. Nothing is saved or sent.</p>
</main>

<script>
  var next = document.getElementById("next");
  var msg = document.getElementById("next-msg");
  var radios = document.querySelectorAll('input[name="who"]');
  for (var i = 0; i < radios.length; i++) {
    radios[i].addEventListener("change", function () {
      next.disabled = false;
      msg.textContent = "";
    });
  }
  next.addEventListener("click", function () {
    var who = document.querySelector('input[name="who"]:checked').value;
    msg.textContent = "Next screen is not built yet. You chose: " + (who === "child" ? "my child" : "myself") + ".";
  });
</script>
</body>
</html>
