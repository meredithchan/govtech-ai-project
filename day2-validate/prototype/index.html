<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport renewal guide (prototype, made-up data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Colours and shapes follow the public ICA site: navy #141b4d, blue #326295, red #d6001c, teal #006682, 8px corners, Inter font. */
  :root { --navy: #141b4d; --blue: #326295; --red: #d6001c; --teal: #006682; --bg: #f2f6f9; --line: #cbd9e7; --text: #131414; --grey: #4d4f50; --off: #c1c6c8; }
  body { font-family: Inter, Lato, Arial, sans-serif; font-size: 1rem; margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: 0; background: #fff; color: var(--navy); padding: 8px 12px; z-index: 10; font-weight: 600; border: 2px solid var(--navy); border-radius: 8px; }
  .skip:focus { left: 8px; top: 8px; }
  .banner { background: var(--red); color: #fff; padding: 8px 20px; font-size: .8125rem; font-weight: 600; text-align: center; }
  header { background: #fff; border-bottom: 4px solid var(--navy); padding: 14px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
  header strong { font-size: 1.25rem; color: var(--navy); font-weight: 700; }
  header .sub { font-size: .8125rem; color: var(--grey); }
  .lang { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .875rem; }
  .lang select, .tester-box select { font-family: inherit; font-size: .875rem; padding: 6px; border-radius: 8px; border: 1px solid var(--grey); background: #fff; color: var(--text); min-height: 32px; }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; display: flex; gap: 20px; align-items: flex-start; }
  main { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  aside { width: 280px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: none; font-size: .875rem; }
  aside.open { display: block; }
  .progress { font-size: .875rem; color: var(--grey); margin-bottom: 8px; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
  .bar div { height: 8px; background: var(--blue); }
  h1 { font-size: 1.5rem; margin: 0 0 16px; color: var(--navy); font-weight: 700; line-height: 1.2; }
  h1:focus { outline: none; }
  .choice { display: block; border: 2px solid var(--line); border-radius: 8px; padding: 16px; margin: 12px 0; font-size: 1.125rem; font-weight: 600; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--blue); background: #e5ecf3; }
  .choice:has(input:focus-visible) { outline: 3px solid var(--navy); outline-offset: 2px; }
  .choice input { margin-right: 10px; transform: scale(1.3); accent-color: var(--blue); }
  .choice .sub { font-size: .875rem; font-weight: 400; color: var(--grey); margin: 4px 0 0 30px; }
  button { font-family: inherit; font-size: 1rem; font-weight: 600; line-height: 1.2; padding: 12px 16px; margin: 16px 8px 0 0; background: #fff; color: var(--blue); border: 1px solid var(--blue); border-radius: 8px; cursor: pointer; min-height: 44px; }
  button:hover { background: #e5ecf3; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: var(--navy); border-color: var(--navy); }
  /* Disabled buttons keep readable text: dark grey on light grey is 5.4 to 1. */
  button:disabled, button:disabled:hover { background: #e4e8ea; border-color: var(--off); color: #5a5d5e; cursor: not-allowed; }
  button.link { background: none; border: none; color: var(--blue); text-decoration: underline; padding: 4px 6px; margin: 0; font-size: .8125rem; font-weight: 600; min-height: 24px; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, #errSum:focus-visible, #retryNote:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .made-up { font-size: .75rem; color: var(--grey); margin-top: 24px; }

  /* Step 2: numbered path to follow */
  .path { margin: 0; padding: 0; list-style: none; position: relative; }
  .path::before { content: ""; position: absolute; left: 21px; top: 24px; bottom: 24px; width: 2px; background: var(--line); }
  .stepcard { position: relative; display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 2px solid var(--blue); border-radius: 8px; padding: 12px; margin: 0 0 14px 0; }
  .stepcard .num { flex: none; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 700; font-size: 1.125rem; z-index: 1; }
  .stepcard .body { flex: 1; font-size: 1.125rem; font-weight: 600; }
  .stepcard .help { font-size: .875rem; font-weight: 400; color: var(--grey); margin-top: 6px; }
  .stepcard.done { background: var(--bg); border-color: var(--line); color: var(--grey); }
  .stepcard.done .num { background: var(--teal); }
  .stepcard.done .body span.t { text-decoration: line-through; }
  .stepcard button { margin: 0; padding: 8px 14px; }
  .stepcard button.link { padding: 4px 6px; margin-left: 6px; }
  .count { font-size: 1rem; font-weight: 700; color: var(--navy); margin: 12px 0 0; }
  .note { background: #e5ecf3; border-left: 4px solid var(--blue); border-radius: 4px; padding: 10px; font-size: .875rem; margin-top: 16px; }
  .note.ok { border-left-color: var(--teal); }

  /* Forms */
  .frow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 18px; }
  label.f { font-weight: 600; }
  .hint { font-size: .8125rem; color: var(--grey); margin: 2px 0 6px; font-weight: 400; }
  input[type=text], input[type=date] { font-family: inherit; width: 100%; max-width: 360px; padding: 10px; font-size: 1rem; box-sizing: border-box; border: 1px solid var(--grey); border-radius: 8px; min-height: 44px; }
  input[aria-invalid=true] { border: 2px solid var(--red); }
  .err { color: var(--red); font-weight: 600; font-size: .875rem; margin-top: 4px; }
  .errsum { border: 2px solid var(--red); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; }
  .errsum ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
  .errsum a { color: var(--red); }
  .eg { border: 1px dashed var(--blue); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--bg); }
  .photo { display: inline-block; width: 110px; min-height: 110px; border: 2px solid var(--grey); border-radius: 8px; text-align: center; font-size: .75rem; margin: 4px 8px 4px 0; vertical-align: top; padding: 6px; box-sizing: border-box; }
  .good { border-color: var(--teal); } .bad { border-color: var(--red); }
  .draft { font-size: .8125rem; color: var(--grey); margin-bottom: 10px; }
  .draft b { color: var(--teal); }
  .welcome-meta { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; font-size: 1rem; }
  .tester { max-width: 900px; margin: 0 auto 32px; padding: 0 16px; }
  .tester-box { background: #fff; border: 2px dashed var(--navy); border-radius: 8px; padding: 14px; font-size: .875rem; }
  .tester-box h2 { font-size: 1rem; margin: 0 0 4px; color: var(--navy); }
  .tester-box h3 { font-size: .9375rem; margin: 16px 0 4px; color: var(--navy); }
  .tester-box table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .tester-box td { padding: 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .tester-box td:first-child { font-weight: 600; width: 38%; }
  .tester-box button { font-size: .875rem; padding: 8px 12px; margin: 6px 8px 0 0; }
  .pass { color: var(--teal); font-weight: 700; }
  .fail { color: var(--red); font-weight: 700; }
  @media (max-width: 760px) { .wrap { flex-direction: column; } aside { width: auto; } .lang { margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function L() { return I18N[state.lang] || I18N.en; }
function t(k, v) {
  var s = L()[k];
  if (s === undefined) { s = I18N.en[k]; }
  if (s === undefined) { s = k; }
  if (v) { for (var x in v) { s = s.split("{" + x + "}").join(v[x]); } }
  return s;
}
function tasksFor(w) { return (L().tasks || I18N.en.tasks)[w]; }

// ---------- State ----------
function blankData() { return { name: "", dob: "", nric: "", passportNo: "", childName: "", childDob: "" }; }

var state = {
  step: 0, who: "", done: {}, helpOpen: {}, stuck: false,
  data: blankData(), ported: blankData(), sp: { status: "idle" }, attempts: 0, retryNote: "",
  step3edits: null, scenario: "ok", recorded: false,
  errors: {}, photo: { status: "none" }, photoNote: false,
  lang: "en", submitted: false,
  savedAt: "", welcome: false, confirmNew: false, saveFailed: false
};
var stuckTimer = null;
var simulateSaveFail = false;   // tester switch: makes saving a draft fail on purpose

// Made-up Singpass test cases. Nobody here is a real person. The NRIC and passport number are made up.
var MADE_UP_PROFILE = { name: "Tan Mei Ling", dob: "1990-03-14", nric: "S0000001A", passportNo: "E0000000X", childName: "Tan Jia Hao", childDob: "2016-09-02" };
var CASES = {
  ok: "Details correct", wrong: "One detail wrong", missing: "Details missing", down: "Singpass unavailable",
  retryDown: "Singpass down, works on retry", retryPartial: "Singpass partial, complete on retry",
  flagged: "Singpass flags applicant (not eligible)"
};

function singpassReturn(c, attempt) {
  var p = blankData(), first = attempt === 0;
  if (c === "down" || (c === "retryDown" && first)) { return { status: "down", data: p }; }
  for (var k in MADE_UP_PROFILE) { p[k] = MADE_UP_PROFILE[k]; }
  if (c === "flagged") { return { status: "flagged", data: p }; }
  if (c === "wrong") { p.name = "Tan Mei Lin"; }
  if (c === "missing" || (c === "retryPartial" && first)) { p.dob = ""; p.childDob = ""; p.passportNo = ""; }
  return { status: "connected", data: p };
}

function relevantFields() {
  return state.who === "child" ? ["childName", "childDob", "name", "nric", "passportNo"] : ["name", "dob", "nric", "passportNo"];
}
function fieldLabel(k) {
  var child = state.who === "child";
  if (k === "name") { return t(child ? "lblParentName" : "lblName"); }
  if (k === "nric") { return t(child ? "lblYourNric" : "lblNric"); }
  if (k === "passportNo") { return t(child ? "lblChildPassport" : "lblPassport"); }
  if (k === "dob") { return t("lblDob"); }
  if (k === "childName") { return t("lblChildName"); }
  return t("lblChildDob");
}
function editedFields() {
  return relevantFields().filter(function (k) { return state.data[k] !== state.ported[k]; });
}
function missingFields() {
  return relevantFields().filter(function (k) { return !state.ported[k]; });
}
function spNote() { return t(state.sp.status === "down" ? "spDown" : "spOk"); }
function singpassNote() {
  if (state.sp.status === "down") { return t("spNoteDown"); }
  var miss = missingFields();
  if (miss.length) { return t("spNoteMissing", { list: miss.map(fieldLabel).join(", ") }); }
  return t("spNoteOk");
}

// ---------- Draft saving. The draft stays in this browser on this device only. The photo is never kept in a draft. ----------
var DRAFT_KEY = "passport-prototype-draft-made-up";
function stepTitle(n) { return [t("whoTitle"), t("readyTitle"), t("detailsTitle"), t("photoTitle"), t("reviewTitle")][n - 1]; }

function readDraft() {
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function persist() {
  try {
    if (simulateSaveFail) { throw new Error("made-up save failure"); }
    var now = new Date();
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      step: state.step, who: state.who, done: state.done, data: state.data, lang: state.lang, attempts: state.attempts,
      ported: state.ported, sp: state.sp, step3edits: state.step3edits, scenario: state.scenario, recorded: state.recorded,
      savedAt: now.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    }));
    state.savedAt = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    state.saveFailed = false;
  } catch (e) { state.saveFailed = true; }
  var el = $("draftStatus");
  if (el) { el.innerHTML = statusText(); }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function statusText() {
  if (state.saveFailed) { return esc(t("saveFailed")) + ' <button class="link" id="trySaveBtn" onclick="saveDraft()">' + esc(t("trySave")) + '</button>'; }
  return state.savedAt ? '<b>' + esc(t("draftSavedLead")) + '</b> ' + esc(t("draftSavedRest", { time: state.savedAt })) : esc(t("progressSaves"));
}

// Field rules (all made up). Letters are made upper case for the two number fields.
function validPastDate(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { return false; }
  var d = new Date(v + "T00:00:00Z");
  return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === v && v <= todayStr() && v >= "1900-01-01";
}
function validate() {
  var errs = {}, d = state.data;
  relevantFields().forEach(function (k) {
    var v = String(d[k] || "").trim();
    if (k === "nric" || k === "passportNo") { v = v.toUpperCase(); }
    d[k] = v;
    if (!v) { errs[k] = "errRequired"; return; }
    if ((k === "name" || k === "childName") && !NAME_RE.test(v)) { errs[k] = "errName"; }
    else if ((k === "dob" || k === "childDob") && !validPastDate(v)) { errs[k] = "errDate"; }
    else if (k === "nric" && !NRIC_RE.test(v)) { errs[k] = "errNric"; }
    else if (k === "passportNo" && !PASS_RE.test(v)) { errs[k] = "errPassport"; }
  });
  return errs;
}

function go(d) {
  saveFields();
  if (d === 1 && state.step === 3) {
    var errs = validate();
    if (Object.keys(errs).length) { state.errors = errs; render(); focusId("errSum"); return; }
    state.errors = {};
  }
  if (d === 1 && state.step === 4 && state.photo.status !== "ok") { return; }
  if (state.step === 3 && d === 1) { state.step3edits = editedFields().length; }
  if (state.step === 4) { state.photoNote = false; }
  state.step += d;
  state.errors = {};

}

// ---------- Passport photo check. Made-up rules. It never keeps the photo and cannot judge a face. ----------
var photoToken = 0;
function checkPhoto(file, meta) {
  var tok = ++photoToken;
  state.photo = { status: "checking" };
  updatePhotoUi();
  var fail = function (code) { if (tok === photoToken) { state.photo = { status: "error", reason: code }; finishPhoto(meta); } };
  if (!/^image\//.test(file.type)) { return fail("photoErrType"); }
  if (file.size > 5 * 1024 * 1024) { return fail("photoErrSize"); }
  var limit = new Date(); limit.setMonth(limit.getMonth() - 6);
  if (file.lastModified && file.lastModified < limit.getTime()) { return fail("photoErrOld"); }   // file date stands in for the photo's date tag
  readBackground(file, function (res) {
    if (tok !== photoToken) { return; }
    if (res === "read") { return fail("photoErrRead"); }
    if (res === "notwhite") { return fail("photoErrBg"); }
    state.photo = { status: "ok" };
    finishPhoto(meta);
  });
}
function readBackground(file, cb) {
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () {
    try {
      var w = 48, h = 48, c = document.createElement("canvas");
      c.width = w; c.height = h;
      var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, w, h);
      var px = ctx.getImageData(0, 0, w, h).data, n = 0, white = 0, edge = 6;
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          if (x < edge || x >= w - edge || y < edge) {   // top and sides only, the bottom shows shoulders
            var i = (y * w + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
            n++;
            if (r >= 200 && g >= 200 && b >= 200 && Math.max(r, g, b) - Math.min(r, g, b) <= 30) { white++; }
          }
        }
      }
      URL.revokeObjectURL(url);
      cb(white / n >= 0.85 ? "white" : "notwhite");
    } catch (e) { URL.revokeObjectURL(url); cb("read"); }
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb("read"); };
  img.src = url;
}
function onPhotoPick(inp) {
  var f = inp.files && inp.files[0];
  if (!f) { photoToken++; state.photo = { status: "none" }; updatePhotoUi(); return; }
  checkPhoto(f, null);
}

  var p = state.photo;

  if (p.status === "ok") { return '<div class="note ok"><b class="pass">&#10003;</b> ' + esc(t("photoOk")) + '</div>'; }
  if (p.status === "error") {

      '<button id="photoTry" onclick="$(\'photoFile\').click()">' + esc(t("photoTry")) + '</button>';
  }
  return "";
}
function updatePhotoUi() {
  var s = $("photoStatus");

}
function finishPhoto(meta) {

}

// ---------- Screens ----------

function connect() {
  var r = singpassReturn(state.scenario, 0);
  state.sp = { status: r.status };
  state.ported = r.data;
  state.data = blankData();
  for (var k in r.data) { state.data[k] = r.data[k]; }
  state.attempts = 0; state.retryNote = "";
  state.errors = {}; state.photo = { status: "none" }; state.photoNote = false;
  state.step3edits = null;
  state.recorded = false;
  quizPick = {};
  state.step = 1;
  persist();
  render();
  focusHeading();
}

// Try Singpass again. Anything the applicant typed is kept.
function retrySingpass() {
  saveFields();
  state.attempts++;
  var r = singpassReturn(state.scenario, state.attempts), merged = blankData();
  for (var k in merged) {
    var typed = state.data[k];
    merged[k] = (typed && typed !== state.ported[k]) ? typed : r.data[k];
  }
  state.sp = { status: r.status };
  state.ported = r.data;
  state.data = merged;
  state.step3edits = null;
  if (r.status === "down") { state.retryNote = "retryFailed"; }
  else if (missingFields().length) { state.retryNote = "retryStillMissing"; }
  else { state.retryNote = "retryWorked"; }
  persist();
  render();
  focusId("retryNote");
}

function submitForm() {
  saveFields();
  var errs = validate();
  if (Object.keys(errs).length) { state.errors = errs; render(); focusId("errSum"); return; }
  state.errors = {};
  finish();
}
function finish() {
  saveFields();
  clearDraft();
  state.submitted = true;
  record();
  renderSubmitted();
  focusHeading();
}
function renderSubmitted() {
  setTitle(t("subTitle"));

  }

function resumeDraft() {
  var dr = readDraft();
  if (dr) {
    state.step = Math.min(Math.max(dr.step, 0), TOTAL);
    state.who = dr.who || "";
    state.done = dr.done || {};
    for (var k in dr.data) { if (state.data.hasOwnProperty(k)) { state.data[k] = dr.data[k]; } }
    if (dr.ported) { for (var j in dr.ported) { if (state.ported.hasOwnProperty(j)) { state.ported[j] = dr.ported[j]; } } }
    state.sp = dr.sp || { status: "idle" };
    state.step3edits = typeof dr.step3edits === "number" ? dr.step3edits : null;
    state.scenario = dr.scenario || "ok";
    state.recorded = !!dr.recorded;
    state.attempts = dr.attempts || 0;
    if (dr.lang && LANGS[dr.lang]) { state.lang = dr.lang; applyChrome(); }
    state.savedAt = "";
    state.photo = { status: "none" };
    if (state.step >= TOTAL) { state.step = 4; state.photoNote = true; }   // the photo is never saved, so ask for it again
  }
  state.welcome = false;
  render();
  focusHeading();
}

// The sign in step stays out of drafts until Singpass has connected.
function startNew() {
  clearDraft();
  clearTimeout(stuckTimer);
  state.welcome = false; state.confirmNew = false; state.submitted = false; state.step = 0; state.who = ""; state.done = {}; state.helpOpen = {}; state.stuck = false;
  state.data = blankData(); state.ported = blankData(); state.sp = { status: "idle" }; state.step3edits = null; state.recorded = false;
  state.attempts = 0; state.retryNote = ""; state.errors = {}; state.photo = { status: "none" }; state.photoNote = false; state.savedAt = "";
  render();
  focusHeading();
}

// Save typed changes as the applicant types, so nothing is lost. A field's error clears when the applicant edits it.
$("main").addEventListener("input", function (e) {
  if (e.target && e.target.id && e.target.id.indexOf("f_") === 0) {
    var key = e.target.id.slice(2);
    if (state.errors[key]) {
      delete state.errors[key];
      var er = $("e_" + key);
      if (er) { er.remove(); }
      e.target.removeAttribute("aria-invalid"); e.target.removeAttribute("aria-describedby");
    }
    saveFields(); persist();
  }
});

// Results live in this page only and are never saved or sent.
var results = [];
var photoChecks = [];

// Made-up document quiz. Only used when Singpass connected. Answers stay on this page.
// This list must match day2-validate/context-skill.md (rules 2 and 3, source S1).
var NOT_NEEDED = ["Printed copy of NRIC", "Proof of address", "Marriage certificate", "Printed Singpass summary"];
var DOCS = {
  self: { need: ["Current passport", "Recent photo"], extra: NOT_NEEDED },
  child: { need: ["Child's passport", "Child's birth certificate", "Recent photo of your child", "Your own ID"], extra: NOT_NEEDED }
};
var lastQuiz = null;
var quizPick = {}, quizResults = [];
function quizList() {
  var d = DOCS[state.who || "self"];
  return d.need.concat(d.extra).sort();
}
function pickDoc(name, on) { quizPick[name] = on; }
function recordQuiz() {
  var d = DOCS[state.who || "self"];
  var missed = d.need.filter(function (x) { return !quizPick[x]; }).length;
  var wrong = d.extra.filter(function (x) { return quizPick[x]; }).length;
  quizResults.push({ who: state.who || "self", missed: missed, wrong: wrong, perfect: !missed && !wrong });
  lastQuiz = {
    missed: d.need.filter(function (x) { return !quizPick[x]; }),
    wrong: d.extra.filter(function (x) { return quizPick[x]; })
  };
  quizPick = {};
  renderTester();
}
function clearQuiz() { quizResults = []; quizPick = {}; lastQuiz = null; renderTester(); }
function lastQuizNote() {
  if (!lastQuiz) { return ""; }
  if (!lastQuiz.missed.length && !lastQuiz.wrong.length) { return '<p>Last answer: <span class="pass">exactly right</span>.</p>'; }
  return '<p>Last answer: <span class="fail">not exact</span>.' +
    (lastQuiz.missed.length ? ' Missed: ' + lastQuiz.missed.map(esc).join(", ") + '.' : '') +
    (lastQuiz.wrong.length ? ' Not needed: ' + lastQuiz.wrong.map(esc).join(", ") + '.' : '') + '</p>';
}
function quizSummary() {
  var n = quizResults.length;
  if (!n) { return ""; }
  var ok = quizResults.filter(function (r) { return r.perfect; }).length;
  var pct = Math.round(ok / n * 100);
  return '<p><b>Success signal (picked exactly the needed documents):</b> ' + ok + ' of ' + n + ' = ' + pct + '%. ' +
    (pct >= 90 ? '<span class="pass">Met (90% or more)</span>' : '<span class="fail">Not met</span>') + '</p>' +
    '<p><b>Kill switch (under 70% exactly right):</b> ' + (pct < 70 ? '<span class="fail">TRIGGERED</span>' : '<span class="pass">Not triggered</span>') + '</p>';
}
function renderQuiz() {
  if (state.sp.status !== "connected") { return '<h3>Document check (made up)</h3><p>Sign in with Singpass (a connected case) to use this check.</p>'; }
  var boxes = quizList().map(function (x) {
    return '<label class="choice"><input type="checkbox" ' + (quizPick[x] ? "checked" : "") + ' onchange="pickDoc(this.dataset.n,this.checked)" data-n="' + esc(x) + '"> ' + esc(x) + '</label>';
  }).join("");
  return '<h3>Document check (made up)</h3>' +
    '<p>Singpass has filled in the details. Which documents do you still need to gather?</p>' + boxes +
    '<button id="quizRec" onclick="recordQuiz()">Record answer</button><button id="quizClr" onclick="clearQuiz()">Clear document results</button>' +
    '<p>Answers recorded: ' + quizResults.length + '</p>' + lastQuizNote() + quizSummary() +
    '<p class="hint">Answer key: context-skill.md, rules 2 and 3 (S1). All document names are made up.</p>';
}

// Made-up photos for the photo check. They are drawn on the page and never saved.
var PHOTO_TESTS = { good: ["Good photo", true], blue: ["Blue background", false], old: ["9 months old", false], notimage: ["Not an image", false] };
function makeMadeUpPhoto(kind, cb) {
  if (kind === "notimage") { cb(new File(["not an image (made up)"], "made-up-note.txt", { type: "text/plain" })); return; }
  var c = document.createElement("canvas"); c.width = 200; c.height = 240;
  var x = c.getContext("2d");
  x.fillStyle = kind === "blue" ? "#2f5fb3" : "#ffffff"; x.fillRect(0, 0, 200, 240);
  x.fillStyle = "#c98f65"; x.beginPath(); x.arc(100, 100, 42, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#2b3a55"; x.beginPath(); x.ellipse(100, 250, 72, 70, 0, 0, Math.PI * 2); x.fill();
  c.toBlob(function (b) {
    var when = kind === "old" ? Date.now() - 270 * 86400000 : Date.now();
    cb(new File([b], "made-up-photo-" + kind + ".png", { type: "image/png", lastModified: when }));
  }, "image/png");
}
function testPhoto(kind) {
  makeMadeUpPhoto(kind, function (f) { checkPhoto(f, { label: PHOTO_TESTS[kind][0], expectOk: PHOTO_TESTS[kind][1] }); });
}
function clearPhotoResults() { photoChecks = []; renderTester(); }
function photoSummary() {
  var n = photoChecks.length;
  if (!n) { return ""; }
  var right = photoChecks.filter(function (r) { return r.ok === r.expectOk; }).length;
  var leaked = photoChecks.filter(function (r) { return r.ok && !r.expectOk; }).length;
  var rows = photoChecks.map(function (r) {
    return '<tr><td>' + esc(r.label) + '</td><td>' + (r.ok ? 'Passed' : 'Stopped') + ' (' + (r.ok === r.expectOk ? '<span class="pass">right</span>' : '<span class="fail">wrong</span>') + ')</td></tr>';
  }).join("");
  return '<table>' + rows + '</table><p><b>Photo check (right verdict on made-up photos):</b> ' + right + ' of ' + n + '. ' +
    (right === n ? '<span class="pass">All right</span>' : '<span class="fail">Some wrong</span>') + '</p>' +
    '<p><b>Kill switch (a bad photo gets through):</b> ' + (leaked ? '<span class="fail">TRIGGERED</span>' : '<span class="pass">Not triggered</span>') + '</p>';
}

function setScenario(v) { state.scenario = v; }

function record() {
  if (state.sp.status === "idle" || state.recorded) { return; }
  var needed = relevantFields();
  var portedAll = state.sp.status === "connected" && needed.every(function (k) { return !!state.ported[k]; });
  var edits = state.step3edits === null ? editedFields().length : state.step3edits;
  results.push({ scenario: CASES[state.scenario], connected: state.sp.status === "connected", portedAll: portedAll, edits: edits, retries: state.attempts,
    flagged: state.sp.status === "flagged", stopped: state.sp.status === "flagged" && state.step <= 1 });
  state.recorded = true;
  persist();
  renderTester();
}

function clearResults() { results = []; renderTester(); }

function summary() {
  var all = results.length;
  if (!all) { return ""; }
  var normal = results.filter(function (r) { return !r.flagged; });
  var flagged = results.filter(function (r) { return r.flagged; });
  var out = "";
  var n = normal.length;
  if (n) {
    var ok = normal.filter(function (r) { return r.connected && r.portedAll; }).length;
    var heavy = normal.filter(function (r) { return r.edits >= 2; }).length;
    var pct = Math.round(heavy / n * 100);
    out += '<p><b>Success signal (connects and all fields ported):</b> ' + ok + ' of ' + n + ' tests.</p>' +
      '<p><b>Kill switch (edited at least 2 fields):</b> ' + heavy + ' of ' + n + ' = ' + pct + '%. ' +
      (pct >= 30 ? '<span class="fail">TRIGGERED (30% or more)</span>' : '<span class="pass">Not triggered (under 30%)</span>') + '</p>';
  }
  if (flagged.length) {
    var stopped = flagged.filter(function (r) { return r.stopped; }).length;
    out += '<p><b>Flag check (flagged applicant stopped before the form):</b> ' + stopped + ' of ' + flagged.length + '. ' +
      (stopped === flagged.length ? '<span class="pass">All stopped</span>' : '<span class="fail">Some got through</span>') + '</p>';
  }
  return out + '<p class="hint">Flagged tests are counted separately from the Singpass connection tests.</p>';
}

function renderTester() {
  var box = $("tester");
  if (!box) { return; }
  var ae = document.activeElement, keepId = (ae && box.contains(ae)) ? ae.id : "";
  var opts = "";
  for (var k in CASES) { opts += '<option value="' + k + '"' + (state.scenario === k ? " selected" : "") + '>' + CASES[k] + '</option>'; }
  var rows = results.map(function (r, i) {
    if (r.flagged) {
      return '<tr><td>Test ' + (i + 1) + ': ' + esc(r.scenario) + '</td><td>Stopped before the form: ' + (r.stopped ? '<span class="pass">yes</span>' : '<span class="fail">no</span>') + '.</td></tr>';
    }
    return '<tr><td>Test ' + (i + 1) + ': ' + esc(r.scenario) + '</td><td>Connected: ' + (r.connected ? '<span class="pass">yes</span>' : '<span class="fail">no</span>') +
      '. All fields ported: ' + (r.portedAll ? '<span class="pass">yes</span>' : '<span class="fail">no</span>') + '. Fields edited: ' + r.edits + '. Retries: ' + (r.retries || 0) + '.</td></tr>';
  }).join("");
  var onPhoto = state.step === 4 && !state.submitted && state.sp.status !== "flagged";
  var pbtn = function (kind) { return '<button id="p_' + kind + '" onclick="testPhoto(\'' + kind + '\')"' + (onPhoto ? "" : " disabled") + '>' + PHOTO_TESTS[kind][0] + '</button>'; };
  box.innerHTML = '<h2>Tester view (made up). Not shown to applicants.</h2>' +
    '<div><label for="scenarioSel">Made-up Singpass case for the next sign in: </label><select id="scenarioSel" onchange="setScenario(this.value)">' + opts + '</select></div>' +
    '<div>This test: Singpass <b>' + esc(state.sp.status) + '</b>. Retries used: <b>' + state.attempts + '</b>. Fields edited so far on "Check your details": <b>' + (state.sp.status === "idle" ? 0 : (state.step3edits === null ? editedFields().length : state.step3edits)) + '</b>.</div>' +
    '<div><label><input type="checkbox" id="simFail" onchange="simulateSaveFail=this.checked;persist();renderTester()"' + (simulateSaveFail ? " checked" : "") + '> Make saving a draft fail (made up)</label></div>' +
    '<button id="recBtn" onclick="record()"' + (state.sp.status === "idle" || state.recorded ? " disabled" : "") + '>Record this test</button>' +
    '<button id="clrBtn" onclick="clearResults()">Clear results</button>' +
    (rows ? '<table>' + rows + '</table>' : '<p>No tests recorded yet.</p>') + summary() +
    '<h3>Photo check (made up)</h3>' +
    '<p>' + (onPhoto ? 'Send a made-up photo through the "Add a photo" step:' : 'Go to the "Add a photo" step to use these.') + '</p>' +
    pbtn("good") + pbtn("blue") + pbtn("old") + pbtn("notimage") +
    '<button id="photoClr" onclick="clearPhotoResults()">Clear photo results</button>' + photoSummary() +
    renderQuiz() +
    '<p class="hint">All profiles, photos and numbers here are made up. Results stay on this page and are not saved or sent. Tamil and Hindi wording needs a native speaker to check it before real use.</p>';
  if (keepId && $(keepId)) { $(keepId).focus(); }
}

// ---------- Start ----------
applyChrome();
if (readDraft()) { state.welcome = true; renderWelcome(); } else { render(); }
</script>
</body>
</html>
