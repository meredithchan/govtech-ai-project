<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport renewal guide (prototype, made-up data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Colours and shapes follow the public ICA site: navy #141b4d, blue #326295, red #d6001c, teal #006682, 8px corners, Inter font. */
  :root { --navy: #141b4d; --blue: #326295; --red: #d6001c; --teal: #006682; --bg: #f2f6f9; --line: #cbd9e7; --text: #131414; --grey: #4d4f50; --off: #c1c6c8; }
  body { font-family: Inter, Lato, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .banner { background: var(--red); color: #fff; padding: 8px 20px; font-size: 13px; font-weight: 600; text-align: center; }
  header { background: #fff; border-bottom: 4px solid var(--navy); padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  header strong { font-size: 20px; color: var(--navy); font-weight: 700; }
  header span { font-size: 13px; color: var(--grey); }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; display: flex; gap: 20px; align-items: flex-start; }
  main { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  aside { width: 280px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: none; font-size: 14px; }
  aside.open { display: block; }
  .progress { font-size: 14px; color: var(--grey); margin-bottom: 8px; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
  .bar div { height: 8px; background: var(--blue); }
  h1 { font-size: 24px; margin: 0 0 16px; color: var(--navy); font-weight: 700; line-height: 120%; }
  .choice { display: block; border: 2px solid var(--line); border-radius: 8px; padding: 16px; margin: 12px 0; font-size: 18px; font-weight: 600; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--blue); background: #e5ecf3; }
  .choice input { margin-right: 10px; transform: scale(1.3); accent-color: var(--blue); }
  .choice .sub { font-size: 14px; font-weight: 400; color: var(--grey); margin: 4px 0 0 30px; }
  button { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 120%; padding: 12px 16px; margin: 16px 8px 0 0; background: #fff; color: var(--blue); border: 1px solid var(--blue); border-radius: 8px; cursor: pointer; }
  button:hover { background: #e5ecf3; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: var(--navy); border-color: var(--navy); }
  button:disabled, button:disabled:hover { background: var(--off); border-color: var(--off); color: #fff; cursor: not-allowed; }
  button.link { background: none; border: none; color: var(--blue); text-decoration: underline; padding: 0; margin: 0 0 0 8px; font-size: 13px; font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .msg { margin-top: 12px; font-size: 14px; color: var(--grey); }
  .made-up { font-size: 12px; color: var(--grey); margin-top: 24px; }

  /* Step 2: numbered path to follow */
  .path { margin: 0; padding: 0; list-style: none; position: relative; }
  .path::before { content: ""; position: absolute; left: 21px; top: 24px; bottom: 24px; width: 2px; background: var(--line); }
  .stepcard { position: relative; display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 2px solid var(--blue); border-radius: 8px; padding: 12px; margin: 0 0 14px 0; }
  .stepcard .num { flex: none; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 700; font-size: 18px; z-index: 1; }
  .stepcard .body { flex: 1; font-size: 18px; font-weight: 600; }
  .stepcard .help { font-size: 14px; font-weight: 400; color: var(--grey); margin-top: 6px; }
  .stepcard.done { background: var(--bg); border-color: var(--line); color: var(--grey); }
  .stepcard.done .num { background: var(--teal); }
  .stepcard.done .body span.t { text-decoration: line-through; }
  .stepcard button { margin: 0; padding: 8px 14px; }
  .count { font-size: 16px; font-weight: 700; color: var(--navy); margin: 12px 0 0; }
  .note { background: #e5ecf3; border-left: 4px solid var(--blue); border-radius: 4px; padding: 10px; font-size: 14px; margin-top: 16px; }

  /* Forms */
  label.f { display: block; font-weight: 600; margin-top: 18px; }
  .hint { font-size: 13px; color: var(--grey); margin: 2px 0 6px; font-weight: 400; }
  input[type=text], input[type=date] { font-family: inherit; width: 100%; max-width: 360px; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid var(--grey); border-radius: 8px; }
  .eg { border: 1px dashed var(--blue); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--bg); }
  .photo { display: inline-block; width: 100px; height: 110px; border: 2px solid var(--grey); border-radius: 8px; text-align: center; font-size: 12px; margin: 4px 8px 4px 0; vertical-align: top; padding-top: 6px; box-sizing: border-box; }
  .good { border-color: var(--teal); } .bad { border-color: var(--red); }
  dl.review dt { font-weight: 600; margin-top: 14px; }
  dl.review dd { margin: 4px 0 0; }
  .draft { font-size: 13px; color: var(--grey); margin-bottom: 10px; }
  .draft b { color: var(--teal); }
  .welcome-meta { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; font-size: 16px; }
  @media (max-width: 760px) { .wrap { flex-direction: column; } aside { width: auto; } header { flex-direction: column; align-items: flex-start; gap: 4px; } }
</style>
</head>
<body>
<div class="banner">PROTOTYPE. Not the real ICA site. Everything here is made up.</div>
<header>
  <strong>Passport renewal guide</strong>
  <span>Styled like the ICA website colours. Not an official page.</span>
</header>

<div class="wrap">
  <main id="main"></main>
  <aside id="side" aria-live="polite"></aside>
</div>

<script>
var TOTAL = 5;

var state = {
  step: 1,
  who: "",
  done: {},
  helpOpen: {},
  stuck: false,
  // Made-up details, as if they came from Singpass. Not real people.
  data: { name: "Tan Mei Ling", dob: "1990-03-14", passportNo: "E0000000X", childName: "Tan Jia Hao", childDob: "2016-09-02" },
  savedAt: "",
  welcome: false,
  confirmNew: false,
  saveFailed: false
};
var stuckTimer = null;

// Draft saving. The draft stays in this browser on this device only. The photo is never kept in a draft.
var DRAFT_KEY = "passport-prototype-draft-made-up";
var STEP_TITLES = ["Who is this passport for?", "Get these ready", "Check your details", "Add a photo", "Check your answers"];

function readDraft() {
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function persist() {
  try {
    var now = new Date();
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      step: state.step, who: state.who, done: state.done, data: state.data,
      savedAt: now.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    }));
    state.savedAt = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    state.saveFailed = false;
  } catch (e) { state.saveFailed = true; }
  var el = document.getElementById("draftStatus");
  if (el) { el.innerHTML = statusText(); }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function statusText() {
  if (state.saveFailed) { return "Could not save a draft in this browser."; }
  return state.savedAt ? "<b>Draft saved</b> at " + state.savedAt + ". You can leave and come back." : "Your progress saves by itself.";
}
function saveDraft() { saveFields(); persist(); }

// Short, verb-first steps. Document names are made-up placeholders, not the real ICA list.
var tasks = {
  self: [
    { t: "Get your current passport.", h: "Check the photo page is clear." },
    { t: "Get a recent photo.", h: "Plain background. Face clear." },
    { t: "Check your passport has not expired.", h: "Look at the expiry date." }
  ],
  child: [
    { t: "Get your child's passport.", h: "Check the photo page is clear." },
    { t: "Get your child's birth certificate.", h: "Can't find it? Ask customer service." },
    { t: "Get a recent photo of your child.", h: "Plain background. Face clear." },
    { t: "Get your own ID.", h: "Use your made-up ID in this prototype." },
    { t: "Check the passport has not expired.", h: "Look at the expiry date." }
  ]
};

// Picture examples open in the side panel so the form is not interrupted.
var examples = {
  name: '<div class="eg"><b>Made-up example</b><br>Tan Mei Ling</div>',
  dob: '<div class="eg"><b>Made-up example</b><br>14 / 03 / 1990</div>',
  passportNo: '<div class="eg"><b>Made-up example</b><br>E0000000X<br>Not a real number.</div>',
  childName: '<div class="eg"><b>Made-up example</b><br>Tan Jia Hao</div>',
  childDob: '<div class="eg"><b>Made-up example</b><br>02 / 09 / 2016</div>',
  parentName: '<div class="eg"><b>Made-up example</b><br>Tan Mei Ling</div>',
  photo: '<span class="photo good">Good<br><br>Face clear.<br>Plain background.</span><span class="photo bad">Not good<br><br>Face covered<br>or blurry.</span><p class="hint">Made-up pictures.</p>'
};

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function showExample(key) {
  $("side").className = "open";
  $("side").innerHTML = "<b>Example</b>" + examples[key] +
    '<button onclick="closeExample()">Close</button>';
}
function closeExample() { $("side").className = ""; $("side").innerHTML = ""; }
function exLink(key) {
  return '<button class="link" onclick="showExample(\'' + key + '\')">See an example</button>';
}

function head(title) {
  return '<div class="progress">Step ' + state.step + ' of ' + TOTAL + '</div>' +
    '<div class="bar"><div style="width:' + (state.step / TOTAL * 100) + '%"></div></div>' +
    '<h1>' + title + '</h1>';
}
function nav(showBack, nextDisabled) {
  return (showBack ? '<button onclick="go(-1)">Back</button>' : '') +
    '<button class="primary" id="nextBtn" onclick="go(1)"' + (nextDisabled ? " disabled" : "") + '>Next</button>' +
    '<button onclick="saveDraft()">Save draft</button>';
}
function footer() {
  return '<p class="made-up">Prototype. Made-up data only. A draft stays in this browser on this device. Nothing is sent.</p>';
}

function saveFields() {
  ["name", "dob", "passportNo", "childName", "childDob"].forEach(function (k) {
    var el = $("f_" + k);
    if (el) { state.data[k] = el.value; }
  });
}

function go(d) {
  saveFields();
  state.step += d;
  closeExample();
  clearTimeout(stuckTimer);
  persist();
  render();
}

function setWho(w) {
  if (state.who !== w) { state.done = {}; state.helpOpen = {}; state.stuck = false; }
  state.who = w;
  $("nextBtn").disabled = false;
  persist();
}

function toggleDone(i) { state.done[i] = !state.done[i]; persist(); render(); }
function toggleHelp(i) { state.helpOpen[i] = !state.helpOpen[i]; render(); }

function doneCount() {
  var list = tasks[state.who] || [], n = 0;
  for (var i = 0; i < list.length; i++) { if (state.done[i]) { n++; } }
  return n;
}

function fieldRow(key, label, type) {
  var val = state.data[key === "parentName" ? "name" : key];
  var id = key === "parentName" ? "name" : key;
  return '<label class="f">' + label + exLink(key) + '</label>' +
    '<input type="' + type + '" id="f_' + id + '" value="' + esc(val) + '">';
}

function render() {
  var m = $("main"), h = "";

  if (state.step === 1) {
    h = head("Who is this passport for?") +
      '<label class="choice"><input type="radio" name="who" ' + (state.who === "self" ? "checked" : "") +
      ' onclick="setWho(\'self\')"> Myself</label>' +
      '<label class="choice"><input type="radio" name="who" ' + (state.who === "child" ? "checked" : "") +
      ' onclick="setWho(\'child\')"> My child<div class="sub">You are the parent. You get extra help.</div></label>' +
      '<div class="note">Signed in with Singpass (made up). Submitting is not approval.</div>' +
      nav(false, !state.who);

  } else if (state.step === 2) {
    var list = tasks[state.who], total = list.length, n = doneCount(), cards = "";
    list.forEach(function (x, i) {
      var isDone = !!state.done[i];
      cards += '<li class="stepcard' + (isDone ? " done" : "") + '">' +
        '<div class="num">' + (isDone ? "&#10003;" : (i + 1)) + '</div>' +
        '<div class="body"><span class="t">' + esc(x.t) + '</span>' +
        '<button class="link" onclick="toggleHelp(' + i + ')">Need help?</button>' +
        (state.helpOpen[i] ? '<div class="help">' + esc(x.h) + '</div>' : "") + '</div>' +
        '<button onclick="toggleDone(' + i + ')">' + (isDone ? "Undo" : "Done") + '</button></li>';
    });
    h = head("Get these ready") +
      '<ol class="path">' + cards + '</ol>' +
      '<div class="count">' + n + ' of ' + total + ' done</div>' +
      (state.who === "child" && state.stuck ? '<div class="note">Stuck? Ask customer service.</div>' : "") +
      nav(true, n < total);
    if (state.who === "child" && !state.stuck) {
      stuckTimer = setTimeout(function () { state.stuck = true; if (state.step === 2) { render(); } }, 15000);
    }

  } else if (state.step === 3) {
    var child = state.who === "child";
    h = head("Check your details") +
      '<div class="note">From Singpass (made up). Fix anything wrong.</div>' +
      (child
        ? fieldRow("childName", "Child's full name", "text") +
          fieldRow("childDob", "Child's date of birth", "date") +
          fieldRow("parentName", "Your full name", "text")
        : fieldRow("name", "Full name", "text") +
          fieldRow("dob", "Date of birth", "date")) +
      fieldRow("passportNo", child ? "Child's passport number" : "Passport number", "text") +
      nav(true, false);

  } else if (state.step === 4) {
    h = head("Add a photo") +
      '<p>Pick a photo from your phone or camera.' + exLink("photo") + '</p>' +
      '<input type="file" accept="image/*">' +
      '<p class="hint">Not saved. Never edited.</p>' +
      nav(true, false);

  } else {
    var d = state.data, c = state.who === "child";
    h = head("Check your answers") +
      '<p>Change anything here.</p><dl class="review">' +
      (c
        ? '<dt>Child\'s full name</dt><dd><input type="text" id="f_childName" value="' + esc(d.childName) + '"></dd>' +
          '<dt>Child\'s date of birth</dt><dd><input type="date" id="f_childDob" value="' + esc(d.childDob) + '"></dd>' +
          '<dt>Your full name</dt><dd><input type="text" id="f_name" value="' + esc(d.name) + '"></dd>'
        : '<dt>Full name</dt><dd><input type="text" id="f_name" value="' + esc(d.name) + '"></dd>' +
          '<dt>Date of birth</dt><dd><input type="date" id="f_dob" value="' + esc(d.dob) + '"></dd>') +
      '<dt>' + (c ? "Child's passport number" : "Passport number") + '</dt>' +
      '<dd><input type="text" id="f_passportNo" value="' + esc(d.passportNo) + '"></dd></dl>' +
      '<div class="note"><b>Submitting is not approval.</b><br>An ICA officer makes the final decision. Your application can still be returned.</div>' +
      '<button onclick="go(-1)">Back</button><button class="primary" onclick="finish()">Submit</button>' +
      '<button onclick="saveDraft()">Save draft</button>';
  }
  m.innerHTML = '<div class="draft" id="draftStatus" aria-live="polite">' + statusText() + '</div>' + h + footer();
}

function renderWelcome() {
  var dr = readDraft();
  var m = $("main");
  var stepNo = dr ? Math.min(Math.max(dr.step, 1), TOTAL) : 1;
  var h = '<h1>Welcome back</h1>' +
    '<p>You have a saved draft.</p>' +
    '<div class="welcome-meta"><b>Last saved:</b> ' + esc(dr ? dr.savedAt : "") + '<br><b>You were on:</b> Step ' + stepNo + ' of ' + TOTAL + ', ' + esc(STEP_TITLES[stepNo - 1]) + '</div>';
  if (state.confirmNew) {
    h += '<div class="note">This deletes your saved draft.</div>' +
      '<button class="primary" onclick="startNew()">Yes, delete it and start new</button>' +
      '<button onclick="state.confirmNew=false;renderWelcome()">Keep my draft</button>';
  } else {
    h += '<button class="primary" id="resumeBtn" onclick="resumeDraft()">Continue where I left off</button>' +
      '<button onclick="state.confirmNew=true;renderWelcome()">Start a new application</button>';
  }
  m.innerHTML = h + footer();
}

function resumeDraft() {
  var dr = readDraft();
  if (dr) {
    state.step = Math.min(Math.max(dr.step, 1), TOTAL);
    state.who = dr.who || "";
    state.done = dr.done || {};
    for (var k in dr.data) { if (state.data.hasOwnProperty(k)) { state.data[k] = dr.data[k]; } }
    state.savedAt = "";
  }
  state.welcome = false;
  render();
}

function startNew() {
  clearDraft();
  state.welcome = false; state.confirmNew = false; state.step = 1; state.who = ""; state.done = {};
  render();
}

function finish() {
  saveFields();
  clearDraft();
  $("main").innerHTML = '<h1>Submitted. Not approved yet.</h1>' +
    '<div class="note">An ICA officer will review it and decide. It can still be returned.</div>' +
    '<p>End of prototype. Nothing was sent.</p>' +
    '<button class="primary" onclick="location.reload()">Start again</button>' + footer();
}

// Save typed changes as the applicant types, so nothing is lost.
document.getElementById("main").addEventListener("input", function (e) {
  if (e.target && e.target.id && e.target.id.indexOf("f_") === 0) { saveFields(); persist(); }
});

if (readDraft()) { state.welcome = true; renderWelcome(); } else { render(); }
</script>
</body>
</html>
